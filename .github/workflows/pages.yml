name: Deploy to GitHub Pages

# Builds the site and publishes it to the gh-pages branch.
# One-time setting: Settings → Pages → Source: "Deploy from a branch" → gh-pages / (root).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:pages
      - run: touch dist/.nojekyll && cp dist/index.html dist/404.html
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          user_name: Pankaj
          user_email: pankqx@gmail.com
          commit_message: Deploy PEECE
